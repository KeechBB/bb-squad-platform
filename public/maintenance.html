<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta http-equiv="refresh" content="30" />
    <title>BlackBerry · технические работы</title>
    <style>
      :root {
        --bg0: #05040a;
        --bg1: #0c0a14;
        --ink: #f4f0fc;
        --muted: #a89cbc;
        --line: rgba(167, 139, 250, 0.28);
        --violet: #b39afa;
        --magenta: #e879f9;
        --cyan: #67e8f9;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body {
        color: var(--ink);
        font-family: "Segoe UI", Tahoma, sans-serif;
        background:
          radial-gradient(900px 520px at 10% -10%, rgba(124, 58, 237, 0.38), transparent 58%),
          radial-gradient(720px 460px at 95% 0%, rgba(232, 121, 249, 0.16), transparent 55%),
          radial-gradient(640px 420px at 50% 115%, rgba(103, 232, 249, 0.08), transparent 50%),
          linear-gradient(180deg, var(--bg1), var(--bg0));
        background-attachment: fixed;
        display: grid;
        place-items: center;
        padding: 28px 18px;
      }
      .wrap {
        width: min(560px, 100%);
        text-align: center;
        padding: 40px 28px 34px;
        border-radius: 22px;
        border: 1px solid var(--line);
        background: linear-gradient(165deg, rgba(30, 24, 52, 0.94), rgba(10, 8, 20, 0.9));
        box-shadow:
          0 0 0 1px rgba(0,0,0,.4),
          0 28px 70px rgba(0,0,0,.5),
          inset 0 1px 0 rgba(196, 181, 253, 0.1);
      }
      .logo {
        width: min(168px, 44vw);
        height: auto;
        margin: 0 auto 20px;
        display: block;
        filter: drop-shadow(0 10px 28px rgba(124, 58, 237, 0.4));
        animation: float 4.5s ease-in-out infinite;
      }
      h1 {
        margin: 0 0 12px;
        font-size: clamp(1.4rem, 4vw, 1.85rem);
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        background: linear-gradient(90deg, var(--violet), var(--magenta), var(--cyan));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      p {
        margin: 0 auto;
        max-width: 36ch;
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 1.55;
      }
      .meta {
        margin-top: 18px;
        font-size: 0.92rem;
        color: #7f7696;
      }
      .bar {
        margin: 26px auto 0;
        width: min(220px, 70%);
        height: 4px;
        border-radius: 999px;
        background: rgba(167, 139, 250, 0.15);
        overflow: hidden;
      }
      .bar > i {
        display: block;
        height: 100%;
        width: 40%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--violet), var(--magenta));
        animation: slide 1.4s ease-in-out infinite;
      }
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }
      @keyframes slide {
        0% { transform: translateX(-30%); }
        100% { transform: translateX(180%); }
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <img class="logo" src="/blackberry.png?v=transparent" alt="BlackBerry" width="168" height="168" />
      <h1>Технические работы</h1>
      <p>Обновляем платформу BlackBerry Squad.<br />Обычно хватает пары минут.</p>
      <p class="meta">Можно не обновлять страницу — она сама перезагрузится.</p>
      <div class="bar" aria-hidden="true"><i></i></div>
    </main>
  </body>
</html>
