<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>BlackBerry · технические работы</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Oxanium:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #07060c;
        --ink: #f2eefc;
        --muted: #9b93b0;
        --violet: #a78bfa;
        --magenta: #d946ef;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      body {
        color: var(--ink);
        font-family: Manrope, system-ui, sans-serif;
        background: var(--bg);
        background-image:
          radial-gradient(
            900px 520px at 12% -8%,
            rgba(124, 58, 237, 0.42),
            transparent 60%
          ),
          radial-gradient(
            700px 480px at 92% 8%,
            rgba(217, 70, 239, 0.18),
            transparent 55%
          ),
          radial-gradient(
            600px 400px at 50% 110%,
            rgba(56, 189, 248, 0.08),
            transparent 50%
          ),
          linear-gradient(180deg, #0b0914 0%, #07060c 100%);
        background-attachment: fixed;
        display: grid;
        place-items: center;
        padding: 32px 20px;
      }
      .card {
        width: min(520px, 100%);
        text-align: center;
        padding: 36px 28px 32px;
        border-radius: 20px;
        border: 1px solid rgba(167, 139, 250, 0.28);
        background: linear-gradient(
          165deg,
          rgba(28, 22, 48, 0.92),
          rgba(12, 10, 22, 0.88)
        );
        box-shadow:
          0 0 0 1px rgba(0, 0, 0, 0.35),
          0 24px 60px rgba(0, 0, 0, 0.45),
          inset 0 1px 0 rgba(196, 181, 253, 0.08);
      }
      .logo {
        width: min(160px, 42vw);
        height: auto;
        margin: 0 auto 18px;
        display: block;
        filter: drop-shadow(0 8px 24px rgba(124, 58, 237, 0.35));
      }
      h1 {
        margin: 0 0 10px;
        font-family: Oxanium, Manrope, sans-serif;
        font-size: clamp(1.35rem, 3.5vw, 1.75rem);
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        background: linear-gradient(90deg, var(--violet), var(--magenta));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      p {
        margin: 0;
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 1.55;
      }
      .pulse {
        margin: 22px auto 0;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--violet);
        box-shadow: 0 0 0 0 rgba(167, 139, 250, 0.55);
        animation: pulse 1.8s ease-out infinite;
      }
      @keyframes pulse {
        0% {
          box-shadow: 0 0 0 0 rgba(167, 139, 250, 0.55);
        }
        70% {
          box-shadow: 0 0 0 16px rgba(167, 139, 250, 0);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(167, 139, 250, 0);
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img
        class="logo"
        src="/brand/blackberry.png"
        width="160"
        height="160"
        alt="BlackBerry"
      />
      <h1>Технические работы</h1>
      <p>
        Сайт на технических работах.<br />
        Запустится в течение 5&nbsp;минут.
      </p>
      <div class="pulse" aria-hidden="true"></div>
    </main>
  </body>
</html>
