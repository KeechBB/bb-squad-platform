# staging.bb-squad.ru
# nginx: /etc/nginx/sites-available/bb-squad-staging
# proxy → 127.0.0.1:3001 (pm2 bb-squad-staging)
# Код: /var/www/bb-squad-platform-staging
# Без maintenance-заглушки прода — staging деплоится отдельно.

server {
    server_name staging.bb-squad.ru;

    location ^~ /brand/ {
        root /var/www/bb-squad-platform-staging/public;
        add_header Cache-Control "public, max-age=86400";
    }

    # Тот же KV-кэш, что у прода (симлинк data/kv-cache → прод)
    location ^~ /kv-static/ {
        alias /var/www/bb-squad-platform/data/kv-cache/;
        add_header Cache-Control "public, max-age=60, must-revalidate";
        add_header X-KV-Source "vps-disk-nginx-staging" always;
        try_files $uri $uri/ =404;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
