# bb-squad.ru / www.bb-squad.ru
# nginx: /etc/nginx/sites-available/bb-squad
# proxy → 127.0.0.1:3000 (pm2 bb-squad)
# Во время deploy.sh появляется /var/www/bb-squad-platform/maintenance.on
# → отдаём красивую заглушку вместо битого Next.js.
# Полная инструкция: docs/DOMAIN.md

server {
    server_name bb-squad.ru www.bb-squad.ru;

    # Статика заглушки (логотип + html) — всегда с диска
    location = /maintenance.html {
        root /var/www/bb-squad-platform/public;
        add_header Cache-Control "no-store";
        add_header Retry-After 300 always;
    }

    location ^~ /brand/ {
        root /var/www/bb-squad-platform/public;
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        # Флаг ставит scripts/deploy.sh на время билда
        if (-f /var/www/bb-squad-platform/maintenance.on) {
            return 503;
        }

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    error_page 503 @maintenance;
    location @maintenance {
        root /var/www/bb-squad-platform/public;
        rewrite ^ /maintenance.html break;
        add_header Cache-Control "no-store";
        add_header Retry-After 300 always;
    }
}
