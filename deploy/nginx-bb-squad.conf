# bb-squad.ru / www.bb-squad.ru
# nginx: /etc/nginx/sites-available/bb-squad
# proxy → 127.0.0.1:3000 (pm2 bb-squad)
# Полная инструкция: docs/DOMAIN.md
#
# Важно для «Карт-дуэль» (WebSocket):
# в location / должны быть Upgrade/Connection заголовки.
# Без них WS на /api/reaction/race/ws не подключится (клиент уйдёт в HTTP fallback).

server {
    server_name bb-squad.ru www.bb-squad.ru;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
