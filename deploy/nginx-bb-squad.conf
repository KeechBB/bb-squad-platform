# bb-squad.ru / www.bb-squad.ru
# nginx: /etc/nginx/sites-available/bb-squad
# proxy → 127.0.0.1:3000 (pm2 bb-squad)
# Во время deploy.sh появляется /var/www/bb-squad-platform/maintenance.on
# → отдаём красивую заглушку вместо битого Next.js.
# Полная инструкция: docs/DOMAIN.md

server {
    server_name bb-squad.ru www.bb-squad.ru;

    # Заглушка техработ (deploy.sh → maintenance.on) + 502/504 пока Next/PM2 мёртв.
    # Важно: error_page → /maintenance.html (не named location) — иначе nginx
    # часто отдаёт белый дефолтный 503 вместо нашей страницы.
    error_page 502 503 504 /maintenance.html;

    location = /maintenance.html {
        root /var/www/bb-squad-platform/public;
        default_type text/html;
        internal;
        add_header Cache-Control "no-store" always;
        add_header Retry-After 180 always;
    }

    # Лого для заглушки (и без internal — чтобы img/src работал, если не data-uri)
    location ^~ /brand/ {
        root /var/www/bb-squad-platform/public;
        add_header Cache-Control "public, max-age=86400";
    }

    # КВ / ТМ таблица — прямо с диска VPS (не через Node и не через GitHub Pages)
    location ^~ /kv-static/ {
        alias /var/www/bb-squad-platform/data/kv-cache/;
        # no-store: после автозалива TR1 таблица/RP должны обновляться сразу
        add_header Cache-Control "no-store, max-age=0, must-revalidate" always;
        add_header X-KV-Source "vps-disk-nginx" always;
        try_files $uri $uri/ =404;
    }

    location / {
        # Флаг ставит scripts/deploy.sh на время билда
        if (-f /var/www/bb-squad-platform/maintenance.on) {
            return 503;
        }

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
        proxy_intercept_errors on;
    }
}
