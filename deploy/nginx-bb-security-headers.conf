# Security headers for bb-squad.ru (F-01…F-05).
# Include inside server / location blocks that already use add_header
# (nginx clears inherited add_header when a location sets its own).
#
# F-01 clickjacking: SAMEORIGIN — own /cw /tm iframes keep working.
# F-02 CSP: only frame-ancestors enforced here; full policy = Report-Only in Next.
# F-03 HSTS
# F-04 nosniff
# F-05: pair with `server_tokens off;` in nginx.conf http{}

add_header X-Frame-Options "SAMEORIGIN" always;
add_header Content-Security-Policy "frame-ancestors 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
