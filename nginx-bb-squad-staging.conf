# staging.bb-squad.ru
# nginx: /etc/nginx/sites-available/bb-squad-staging
# proxy → 127.0.0.1:3001 (pm2 bb-squad-staging)
# Код: /var/www/bb-squad-platform-staging

server {
    listen 80;
    listen [::]:80;
    server_name staging.bb-squad.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name staging.bb-squad.ru;

    ssl_certificate     /etc/letsencrypt/live/staging.bb-squad.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.bb-squad.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location ^~ /brand/ {
        root /var/www/bb-squad-platform-staging/public;
        add_header Cache-Control "public, max-age=86400";
    }

    # Тот же KV-кэш, что у прода (симлинк data/kv-cache → прод)
    location ^~ /kv-static/ {
        alias /var/www/bb-squad-platform/data/kv-cache/;
        add_header Cache-Control "public, max-age=60, must-revalidate";
        add_header X-KV-Source "vps-disk-nginx-staging" always;
        try_files $uri $uri/ =404;
    }

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
